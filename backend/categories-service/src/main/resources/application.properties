server.port=8082
spring.application.name=categories-service

# Database Configuration (H2 for local testing)
spring.datasource.url=jdbc:h2:mem:categories_db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Azure AD Configuration
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/YOUR_TENANT_ID/v2.0
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://login.microsoftonline.com/YOUR_TENANT_ID/discovery/v2.0/keys

# CORS Configuration
cors.allowed-origins=http://localhost:4200,https://YOUR_GITHUB_PAGES_URL

logging.level.com.ecommerce=DEBUG
