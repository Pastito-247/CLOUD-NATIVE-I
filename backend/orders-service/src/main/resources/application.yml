server:
  port: 8084

spring:
  application:
    name: orders-service

  # Database Configuration (H2 for local testing)
  datasource:
    url: jdbc:h2:mem:orders_db
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  # Azure AD Configuration (JWT: issuer + audience)
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://login.microsoftonline.com/e3e92dfe-ea59-4c42-a539-90e6fea570b6/v2.0
          # Audiencia = claim 'aud' del access token de Entra. Entra puede emitir el
          # Application ID URI (api://tuki-tech-api) o el Application (client) ID (GUID);
          # se aceptan ambos. Debe coincidir con el JWT authorizer del API Gateway.
          audiences: api://tuki-tech-api,66c0f84b-3701-42fb-9189-3f4092cba201

  # RabbitMQ (CloudAMQP / instancia existente). Overridable por variables de entorno.
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    ssl:
      enabled: ${RABBITMQ_SSL:false}
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1
        default-requeue-rejected: false

# CORS Configuration
cors:
  allowed-origins: "http://localhost:4200,https://pastito-247.github.io"

# ============================================================
# JWT local (login con cuentas creadas en /register).
# users-service lo firma (HS256) y el resto de los microservicios
# lo validan con el MISMO secreto compartido.
# ============================================================
app:
  security:
    local-jwt:
      issuer: ${LOCAL_JWT_ISSUER:tuki-tech-local}
      secret: ${LOCAL_JWT_SECRET:tuki-tech-local-dev-secret-change-me-0123456789}

# ============================================================
# Configuracion centralizada de mensajeria (RabbitMQ).
# Unica fuente de verdad para nombres de exchanges, colas y
# routing keys. Ningun nombre debe escribirse en el codigo de negocio.
#
# Este servicio consume:
#   order.review.queue  (pedido para revision staff/admin) <- receipt.exchange
#
# Y produce:
#   order.created       -> order.exchange  (aviso "pedido recibido")
# ============================================================
messaging:
  exchange:
    receipt: receipt.exchange
    receipt-dead-letter: receipt.dlx
    order: order.exchange
    order-dead-letter: order.dlx
  queue:
    order-review: order.review.queue
    order-review-dlq: order.review.dlq
    order-created: order.created.queue
    order-created-dlq: order.created.dlq
  routing-key:
    order-review-dlq: order.review.dlq
    order-created-dlq: order.created.dlq
  retry:
    max-attempts: 3
    delay-ms: 500

# Logging
logging:
  level:
    com.ecommerce: INFO
