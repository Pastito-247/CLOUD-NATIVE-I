server.port=8084
spring.application.name=orders-service

# Database Configuration (H2 for local testing)
spring.datasource.url=jdbc:h2:mem:orders_db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Azure AD Configuration (JWT: issuer + audience)
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/e3e92dfe-ea59-4c42-a539-90e6fea570b6/v2.0
# Audiencia = Application ID URI de la API. Debe coincidir con el claim 'aud' del access token.
spring.security.oauth2.resourceserver.jwt.audiences=api://tuki-tech-api

# CORS Configuration
cors.allowed-origins=http://localhost:4200,https://pastito-247.github.io

# Logging
logging.level.com.ecommerce=INFO
