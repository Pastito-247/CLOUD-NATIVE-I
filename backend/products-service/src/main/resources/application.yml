server:
  port: 8081

spring:
  application:
    name: products-service

  # Database Configuration (H2 for local testing)
  datasource:
    url: jdbc:h2:mem:products_db
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  # Azure AD Configuration (JWT: issuer + audience)
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://login.microsoftonline.com/e3e92dfe-ea59-4c42-a539-90e6fea570b6/v2.0
          # Audiencia = claim 'aud' del access token de Entra. Entra puede emitir el
          # Application ID URI (api://tuki-tech-api) o el Application (client) ID (GUID);
          # se aceptan ambos. Debe coincidir con el JWT authorizer del API Gateway.
          audiences: api://tuki-tech-api,66c0f84b-3701-42fb-9189-3f4092cba201

  # RabbitMQ (CloudAMQP / instancia existente). Overridable por variables de entorno.
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    ssl:
      enabled: ${RABBITMQ_SSL:false}
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1
        default-requeue-rejected: false

# CORS Configuration
cors:
  allowed-origins: "http://localhost:4200,https://pastito-247.github.io"

# ============================================================
# Configuracion centralizada de mensajeria (RabbitMQ).
# Unica fuente de verdad para nombres de exchanges, colas y
# routing keys. Ningun nombre debe escribirse en el codigo de negocio.
# ============================================================
messaging:
  exchange:
    catalog: catalog.exchange
    dead-letter: catalog.dlx
    # Exchange del flujo de pago: de aqui llega la cola de descuento de stock.
    receipt: receipt.exchange
    receipt-dead-letter: receipt.dlx
  queue:
    product-sync: product.sync.queue
    product-sync-dlq: product.sync.dlq
    stock-decrement: stock.decrement.queue
    stock-decrement-dlq: stock.decrement.dlq
  routing-key:
    product-created: product.created
    product-updated: product.updated
    product-deleted: product.deleted
    category-created: category.created
    category-updated: category.updated
    category-deleted: category.deleted
    product-sync-dlq: product.sync.dlq
    stock-decrement-dlq: stock.decrement.dlq
  retry:
    max-attempts: 3
    delay-ms: 500

# Logging
logging:
  level:
    com.ecommerce: INFO
