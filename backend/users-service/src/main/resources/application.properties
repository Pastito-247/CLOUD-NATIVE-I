server.port=8083
spring.application.name=users-service

# Database Configuration (H2 for local testing)
spring.datasource.url=jdbc:h2:mem:users_db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Azure AD Configuration (JWT: issuer + audience)
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/e3e92dfe-ea59-4c42-a539-90e6fea570b6/v2.0
# Audiencia = claim 'aud' del access token de Entra (client ID de la API, no el App ID URI).
spring.security.oauth2.resourceserver.jwt.audiences=66c0f84b-3701-42fb-9189-3f4092cba201

# CORS Configuration
cors.allowed-origins=http://localhost:4200,https://pastito-247.github.io

logging.level.com.ecommerce=INFO