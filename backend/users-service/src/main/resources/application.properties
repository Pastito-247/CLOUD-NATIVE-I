server.port=
spring.application.name=users-service

# Database Configuration (H2 for local testing)
spring.datasource.url=jdbc:h2:mem:users_db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Azure AD Configuration
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/e3e92dfe-ea59-4c42-a539-90e6fea570b6/v2.0
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://login.microsoftonline.com/e3e92dfe-ea59-4c42-a539-90e6fea570b6/discovery/v2.0/keys

# CORS Configuration
cors.allowed-origins=http://localhost:4200,https://tu-usuario.github.io/tuki-tech/

logging.level.com.ecommerce=DEBUG

# ==============================
# Entra ID (Azure AD) OAuth2/OIDC - Resource Server
# Los valores provienen del archivo .env de la raiz del proyecto.
# Si no estan definidos, se usan los valores por defecto (placeholder).
# ==============================
# Issuer URI: Spring Boot descarga automaticamente las claves JWKS
# del tenant para validar la firma del access token.
#   ENV: ENTRA_AUTHORITY
spring.security.oauth2.resourceserver.jwt.issuer-uri=

# Audience: Application ID URI de tu API. Debe coincidir con el 'aud' del token.
#   ENV: ENTRA_API_URI
spring.security.oauth2.resourceserver.jwt.audiences=
