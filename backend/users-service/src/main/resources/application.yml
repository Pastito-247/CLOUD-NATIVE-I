server:
  port: 8083

spring:
  application:
    name: users-service

  # Database Configuration (H2 for local testing)
  datasource:
    url: jdbc:h2:mem:users_db
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  # Azure AD Configuration (JWT: issuer + audience)
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://login.microsoftonline.com/e3e92dfe-ea59-4c42-a539-90e6fea570b6/v2.0
          # Audiencia = claim 'aud' del access token de Entra. Entra puede emitir el
          # Application ID URI (api://tuki-tech-api) o el Application (client) ID (GUID);
          # se aceptan ambos. Debe coincidir con el JWT authorizer del API Gateway.
          audiences: api://tuki-tech-api,66c0f84b-3701-42fb-9189-3f4092cba201

  # RabbitMQ (CloudAMQP / instancia existente). Overridable por variables de entorno.
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    ssl:
      enabled: ${RABBITMQ_SSL:false}
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1
        default-requeue-rejected: false

# CORS Configuration
cors:
  allowed-origins: "http://localhost:4200,https://pastito-247.github.io"

# ============================================================
# JWT local (login con cuentas creadas en /register).
# users-service lo firma (HS256) y el resto de los microservicios
# lo validan con el MISMO secreto compartido.
# ============================================================
app:
  security:
    local-jwt:
      issuer: ${LOCAL_JWT_ISSUER:tuki-tech-local}
      secret: ${LOCAL_JWT_SECRET:tuki-tech-local-dev-secret-change-me-0123456789}
      expiration-minutes: ${LOCAL_JWT_EXPIRATION_MINUTES:60}

# ============================================================
# Configuracion centralizada de mensajeria (RabbitMQ).
# Unica fuente de verdad para nombres de exchanges, colas y
# routing keys. Debe coincidir con la topologia declarada por
# payments-service (mismos nombres y argumentos).
#
# Este servicio consume:
#   payment.notification.queue  (aviso "pago en proceso")
#   receipt.email.queue         (correo confirmacion + boleta)
#   order.created.queue         (aviso "pedido recibido")     <- order.exchange
#   user.registered.queue       (correo de bienvenida)        <- user.exchange
#
# Y produce (desacopla el alta del envio de bienvenida):
#   user.registered             -> user.exchange
# ============================================================
messaging:
  exchange:
    payment: payment.exchange
    payment-dead-letter: payment.dlx
    receipt: receipt.exchange
    receipt-dead-letter: receipt.dlx
    order: order.exchange
    order-dead-letter: order.dlx
    user: user.exchange
    user-dead-letter: user.dlx
  queue:
    payment-notification: payment.notification.queue
    payment-notification-dlq: payment.notification.dlq
    receipt-email: receipt.email.queue
    receipt-email-dlq: receipt.email.dlq
    order-created: order.created.queue
    order-created-dlq: order.created.dlq
    user-registered: user.registered.queue
    user-registered-dlq: user.registered.dlq
  routing-key:
    payment-notification-dlq: payment.notification.dlq
    receipt-email-dlq: receipt.email.dlq
    order-created-dlq: order.created.dlq
    user-registered-dlq: user.registered.dlq
  retry:
    max-attempts: 3
    delay-ms: 500

# Logging
logging:
  level:
    com.ecommerce: INFO
