<div class="admin-container">
  <h1>Auditoría</h1>
  <p class="subtitle">Trazabilidad de eventos: quién, qué, cuándo y desde dónde.</p>
  <p *ngIf="error" class="error">{{ error }}</p>

  <div class="form-row">
    <label>Tipo <input [(ngModel)]="filters.eventType" placeholder="ORDER_CREATED" /></label>
    <label>Actor <input [(ngModel)]="filters.actor" placeholder="guest" /></label>
    <label>Desde <input [(ngModel)]="filters.from" placeholder="2026-01-01T00:00:00Z" /></label>
    <label>Hasta <input [(ngModel)]="filters.to" placeholder="2026-12-31T23:59:59Z" /></label>
    <button class="btn-primary" (click)="query()">Filtrar</button>
  </div>

  <table>
    <thead>
      <tr><th>Fecha</th><th>Tipo</th><th>Actor</th><th>Orden</th><th>Tópico</th><th>Offset</th></tr>
    </thead>
    <tbody>
      <tr *ngFor="let r of records">
        <td>{{ r.occurredAt }}</td>
        <td>{{ r.eventType }}</td>
        <td>{{ r.actor }}</td>
        <td>{{ r.orderId }}</td>
        <td>{{ r.topic }}</td>
        <td>{{ r.offset }}</td>
      </tr>
    </tbody>
  </table>
</div>
