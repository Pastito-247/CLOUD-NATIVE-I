<div class="login-container">

  <div class="login-card">

    <div class="login-logo">
      <svg class="login-logo-svg" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M12 40 C 4 44, 2 32, 10 27" stroke="#4ade80" stroke-width="5" stroke-linecap="round"/>
        <path d="M10 27 C 14 25, 18 21, 24 17 C 30 13, 39 13, 45 17" stroke="#22c55e" stroke-width="7" stroke-linecap="round"/>
        <circle cx="49" cy="18" r="6.5" fill="#22c55e"/>
        <circle cx="51" cy="16" r="1.8" fill="#14532d"/>
        <path d="M41 15 C 41 9, 45 7, 49 9" stroke="#16a34a" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M37 19 C 37 25, 41 28, 45 26" stroke="#16a34a" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M24 17 C 24 11, 28 9, 32 11" stroke="#16a34a" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M20 23 C 20 29, 24 31, 28 29" stroke="#16a34a" stroke-width="3.5" stroke-linecap="round"/>
      </svg>
    </div>

    <h2>Iniciar Sesión</h2>

    <p class="login-text">
      Ingresa con la cuenta que creaste en el registro o con tu cuenta de
      Microsoft.
    </p>

    <form class="login-form" (ngSubmit)="loginLocal()">

      <label class="login-label" for="email">Email</label>
      <input
        id="email"
        name="email"
        class="login-input"
        type="email"
        [(ngModel)]="email"
        placeholder="tucorreo@ejemplo.com"
        autocomplete="email"
        required>

      <label class="login-label" for="password">Contraseña</label>
      <input
        id="password"
        name="password"
        class="login-input"
        type="password"
        [(ngModel)]="password"
        placeholder="Tu contraseña"
        autocomplete="current-password"
        required>

      <div *ngIf="errorMessage" class="login-message error">{{ errorMessage }}</div>

      <button type="submit" class="login-button" [disabled]="loading">
        {{ loading ? 'Ingresando...' : 'Iniciar Sesión' }}
      </button>

    </form>

    <div class="login-divider"><span>o</span></div>

    <button type="button" (click)="loginMicrosoft()" class="login-button login-button-outline">
      <span class="ms-icon" aria-hidden="true">
        <svg viewBox="0 0 23 23" width="18" height="18">
          <rect width="11" height="11" fill="#f35325" x="1" y="1"/>
          <rect width="11" height="11" fill="#81bc06" x="12" y="1"/>
          <rect width="11" height="11" fill="#05a6f0" x="1" y="12"/>
          <rect width="11" height="11" fill="#ffba08" x="12" y="12"/>
        </svg>
      </span>
      Iniciar Sesión con Microsoft
    </button>

    <p class="login-hint">
      ¿No tienes cuenta? <a routerLink="/register">Regístrate</a>
    </p>

  </div>

</div>
