<nav class="navbar">
  <div class="nav-container">
    <h1>{{ title }}</h1>
    <div class="nav-links">
      <a routerLink="/">Home</a>
      <a routerLink="/admin" *ngIf="isLoggedIn && isAdminUser">Admin</a>
      <span *ngIf="isLoggedIn && userName" style="margin-left:12px; font-weight:bold; color: #22c55e;">{{ userName }}</span>
      <button *ngIf="!isLoggedIn" (click)="login()">Login</button>
      <button *ngIf="isLoggedIn" (click)="logout()">Logout</button>
    </div>
  </div>
</nav>

<router-outlet></router-outlet>
