<div class="register-container">

  <div class="register-card">

    <div class="register-logo">
      <svg class="register-logo-svg" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M12 40 C 4 44, 2 32, 10 27" stroke="#4ade80" stroke-width="5" stroke-linecap="round"/>
        <path d="M10 27 C 14 25, 18 21, 24 17 C 30 13, 39 13, 45 17" stroke="#22c55e" stroke-width="7" stroke-linecap="round"/>
        <circle cx="49" cy="18" r="6.5" fill="#22c55e"/>
        <circle cx="51" cy="16" r="1.8" fill="#14532d"/>
        <path d="M41 15 C 41 9, 45 7, 49 9" stroke="#16a34a" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M37 19 C 37 25, 41 28, 45 26" stroke="#16a34a" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M24 17 C 24 11, 28 9, 32 11" stroke="#16a34a" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M20 23 C 20 29, 24 31, 28 29" stroke="#16a34a" stroke-width="3.5" stroke-linecap="round"/>
      </svg>
    </div>

    <h2>Crear Cuenta</h2>

    <p class="register-text">
      Regístrate en Tuki-Tech. Crearemos tu perfil de cliente y te
      enviaremos un correo de bienvenida.
    </p>

    <form (ngSubmit)="submit()" #registerForm="ngForm" class="register-form">

      <label class="register-label" for="name">Nombre</label>
      <input
        id="name"
        name="name"
        class="register-input"
        type="text"
        [(ngModel)]="name"
        placeholder="Tu nombre"
        autocomplete="name"
        required>

      <label class="register-label" for="email">Email</label>
      <input
        id="email"
        name="email"
        class="register-input"
        type="email"
        [(ngModel)]="email"
        placeholder="tucorreo@ejemplo.com"
        autocomplete="email"
        required>

      <label class="register-label" for="password">Contraseña</label>
      <input
        id="password"
        name="password"
        class="register-input"
        type="password"
        [(ngModel)]="password"
        placeholder="Mínimo 6 caracteres"
        autocomplete="new-password"
        minlength="6"
        required>

      <label class="register-label" for="role">Tipo de cuenta</label>
      <select id="role" name="role" class="register-input" [(ngModel)]="role">
        <option value="customer">Cliente</option>
        <option value="admin">Administrador</option>
      </select>

      <div *ngIf="errorMessage" class="register-message error">{{ errorMessage }}</div>
      <div *ngIf="successMessage" class="register-message success">{{ successMessage }}</div>

      <button type="submit" class="register-button" [disabled]="loading">
        {{ loading ? 'Creando cuenta...' : 'Registrarme' }}
      </button>

    </form>

    <p class="register-hint">
      ¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a>
    </p>

  </div>

</div>
